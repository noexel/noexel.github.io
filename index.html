<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSO</title>
    <link rel="shortcut icon" href="logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="brand">
            <div class="logo"><img src="logo.svg"></div>
            <div class="name">DSO Project</div>
        </div>
        <div class="main">
            <div class="main-text">$DSO<br>Welcome to token RoadMap</div>
            <div class="comment">Let’s talk about this project in chat</div>
            <div class="chat-btn">Chat</div>
            <div class="roadmap">
                <div class="block">
                    <div class="road">Token Launch</div>
                    <div class="date">20.02<span style="opacity: .5;">.25</span></div>
                </div>
                <div class="block">
                    <div class="road">Project Reveal</div>
                    <div class="date">28.02<span style="opacity: .5;">.25</span></div>
                </div>
                <div class="block">
                    <div class="road">Project Pre-Test for holders</div>
                    <div class="date">10.03<span style="opacity: .5;">.25</span></div>
                </div>
                <div class="block">
                    <div class="road">Pass for $DSO</div>
                    <div class="date">17.03<span style="opacity: .5;">.25</span></div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div id="tg" class="social">Telegram</div>
            <div id="x" class="social">Twitter</div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
